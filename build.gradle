plugins {
    id 'groovy'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

/**
 * Token optimisation: tighter tool descriptions, slim pathToMap, relative tree paths,
 * compact response mode, compact and verbose options, compress large payloads
 */
group = 'com.softwood'
version = '0.7.43'  // v0.7.43: FIX-A doRead refuses >200 lines; FIX-B session token meter in every read response; FIX-C McpController global backstop 64K chars; FIX-D hash-gated re-read on read/head/tail/range/get_method //  // v0.7.42: readSoftCapChars 40K->8K, partialReadCapChars 40K->12K, multiReadCapChars 80K->24K, readChunkThresholdKb 300->60, multi aggregateCapBytes 1MB->256KB, tool description updated with efficiency rules //  // v0.7.41: promoteTopLevelParams() - aliasing for old_str/new_str/oldText/newText at top-level; same for replacements in patch/multi_replace; tightened replace description to force options nesting // v0.7.40: replace description adds LF/CRLF line-ending warning, prefer patch for multi-line replacements // v0.7.39: PowerShell execute via temp .ps1 file (-File) instead of -Command, fixes multi-line scripts and regex quoting via MCP JSON serialisation // v0.7.38: FIX-C1 chunk_read cap at partialReadCapChars (was 400KB raw); replace description warns on silent failure  // v0.7.37: multi hash short-circuit (knownHashes), file_content_hash on all multi results, re-read guidance in description // v0.7.36: SSE transport (McpSseController GET /sse + POST /message), actuator health endpoint

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    springAiVersion = '1.1.2'
    groovyVersion = '5.0.4'
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Jackson (for JSON serialization)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Spring AI MCP
    implementation "org.springframework.ai:spring-ai-mcp:${springAiVersion}"
    
    // Jakarta Annotations
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    
    // Groovy
    implementation "org.apache.groovy:groovy:${groovyVersion}"
    implementation "org.apache.groovy:groovy-json:${groovyVersion}"
    implementation "org.apache.groovy:groovy-nio:${groovyVersion}"
    implementation "org.apache.groovy:groovy-templates:${groovyVersion}"
    
    // Logging
    implementation 'ch.qos.logback:logback-classic'
    
    // SQLite - shared persistence with context server
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.apache.groovy:groovy-test:${groovyVersion}"
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
