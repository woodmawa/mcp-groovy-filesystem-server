plugins {
    id 'groovy'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

/**
 * Token optimisation: tighter tool descriptions, slim pathToMap, relative tree paths,
 * compact response mode, compact and verbose options, compress large payloads
 */
group = 'com.softwood'
version = '0.8.75'
// v0.8.75: Race condition fix -- retry-with-backoff in FileReadService and FileWriteService init().
//   Root cause: @PostConstruct fires before CS HTTP companion (:8082) is ready to accept
//   connections. ServerLifecycleService.autoStartHttpCompanions() spawns the companion
//   process but returns immediately after fork -- :8082 is not yet listening when
//   FileReadService/FileWriteService init() call getHelpSection().
//   Fix: both init() methods now retry 3 times (0ms / 300ms / 700ms) before falling back
//   to DEFAULT_DESC. Covers the typical 200-500ms companion startup window.
//   Safe: Thread.sleep on Spring @PostConstruct thread; no blocking on hot path.
//   Fallback unchanged -- DEFAULT_DESC_* always used if all retries fail.
// v0.8.74: DB-driven tool description for FileWriteService (idea #109 completion).
//   @PostConstruct init() loads tool_desc_file_write (compact) and
//   tool_desc_file_write_verbose from CS help_sections at FS startup.
//   Falls back to DEFAULT_DESC_COMPACT/VERBOSE static constants if CS unreachable.
//   help_sections rows seeded: tool_desc_file_write + tool_desc_file_write_verbose.
//   Tool description for file_write is now updatable via CS context_write without
//   a build or jar deploy. DT restart required to reload after CS section update.
//   ContextServerClient.getHelpSection() already implemented (v0.8.70) -- reused.
//   FileReadService (v0.8.70) + FileWriteService (v0.8.74) are now both DB-driven.
//   Idea #109 status updated to delivered.
// v0.8.73: CT-EH-1 -- expectedHash is now MANDATORY for replace|patch|multi_replace (FS TDD).
//   Root cause: absent expectedHash allowed silent double-writes and cross-session file bleed.
//   FileReplaceService.doReplace: warn->toolError when expectedHash absent.
//   FileReplaceService.doMultiReplace: same.
//   FilePatchService.doPatch: same.
//   FileWriteService.promoteTopLevelParams: fix -- when oldText+expectedHash both top-level,
//     case 'replace' block now seeds from merged (not raw options), so expectedHash carried forward.
//   CT-EH-1a/b/c: reject replace|multi_replace|patch when expectedHash absent.
//   CT-EH-2: stale expectedHash -> drift guard fires, file unchanged.
//   CT-EH-3: correct expectedHash -> succeeds (guard not over-blocking).
//   CT-57/CT-61: updated from 'succeeds without hash' to 'rejected, file unchanged'.
//   CT-63: updated to pass dummy expectedHash so file-not-found fires (not hash guard).
//   FileServicesSmokeSpec patch tests: expectedHash added.
//   FileWriteService.getToolDefinitions: compact+verbose descriptions updated to reflect mandatory.
//   CS tool_descriptions row inserted for file_write with correct mandatory language.
//   CS help_sections tool_desc_file_read updated: last line corrected from 'optional' to 'mandatory'.
//   Full suite: 153 tests, 0 failures.
// v0.8.72: CT-RW-1..5 -- replace structural safety (TDD).
//   CT-RW-1: replace on .groovy/.java with unbalanced brace in newText is now a hard error
//            (file NOT modified) -- same as patch/multi_replace. Previously only a warning.
//   CT-RW-3: DESTRUCTIVE_REPLACE guard now accepts force=true escape hatch for legitimate
//            large deletions (e.g. removing orphan DDL blocks). Guard still active without force.
//   CT-RW-4: DESTRUCTIVE_REPLACE error message now includes 'pass options.force=true' hint.
//   CT-RW-5: replace with oldText not found returns clear not-found error (pre-existing behaviour, now contract-tested).
//   Full suite: 143 tests, 0 failures.
// v0.8.71: CT-80/CT-81 -- patch paren-delta guard (FilePatchService). Patch on .groovy/.java
//   now checks parenthesis delta per replacement, same as brace delta (CT-14). Catches dropped
//   closing ) on method-call GStrings (e.g. prepareStatement("""...""")). FIX-E3 root cause.
//   CT-2/CT-19/CT-73/CT-76 -- fixed guard order in FileReplaceService.doReplace: oldText
//   checked before newText, so empty-options calls surface 'oldText required' not 'newText missing'.
// v0.8.70: FileReadService.getToolDefinitions() now DB-driven via ContextServerClient.getHelpSection().
//   @PostConstruct init() loads tool_desc_file_read row from CS help_sections on startup.
//   Falls back to DEFAULT_DESC static constant if CS unreachable. Idea #109.
// v0.8.69: FIX-6A -- BLOCKED_UNRANGED_INDEXED_READ error now includes known_hash field
//   for each blocked file when CS has a registry entry for the path. FS calls CS via
//   ContextServerClient.getKnownHashForPath(normalizedPath) -- context_read scope=ontology
//   action=file-hash query=<path> -- 500ms timeout, fail-silent. Allows caller to pass
//   options.knownHash on retry and get ~15-token unchanged short-circuit if unmodified.
//   No direct SQLite coupling: CS owns file_hash_registry, exposes via tool call.
//   CT-FW-REPLACE-1..4 -- newText absent vs explicit empty string guard in doReplace and
//   doMultiReplace. Previously (options.newText as String ?: '') silently treated missing
//   newText as '' -- no error, oldText quietly deleted from file. Fix: containsKey('newText')
//   guard. Absent key = hard error ('newText missing'). Explicit newText:'' = allowed
//   (deliberate deletion). 4 new tests in FileReplaceAndPatchSpec; 21/21 passing.
// v0.8.68: CT-77..CT-79 patch expectedRemovedText content guard. doPatch validates
//   each replacement entry's optional expectedRemovedText against lines[start..end].
//   Mismatch = CONTENT_MISMATCH toolError, file untouched. Prevents stale line-number
//   mistakes silently corrupting non-Groovy/Java files (no brace-delta on those).
//   Field is opt-in -- omitting it preserves existing line-range behaviour (CT-79).
// v0.8.67: CT-DR-1..CT-DR-4 destructive-replace ratio guard. doReplace now rejects when
//   oldText.length > 500 AND newText.length < 20% of oldText.length -- the silent content-
//   destruction pattern (oldText=entire file, newText=truncated fragment). Returns
//   DESTRUCTIVE_REPLACE toolError with hint to use action=write for full-file rewrites.
//   Root cause: replace with oldText=<whole file> + newText=<partial> wipes file body.
//   Four contract tests added to FileReplaceAndPatchSpec (CT-DR-1..4).
// v0.8.66: CT-74 fix -- doPatch now validates startLine/endLine presence before int cast.
//   Missing startLine/endLine returned raw NPE instead of structured toolError.
//   Now returns 'Missing startLine in replacement entry' with usage hint.
//   CT-73..CT-76 contract tests added to FileContractSpec.
// v0.8.65: D5 fix -- McpController.handleRequest() session ID hardcode resolved.
//   Prior: telemetryService.recordToolCall('unknown', ...) for ALL transports meant
//   tool_call_telemetry rows had session_id='unknown', causing knownhash_pct and
//   read_count in sessions_index to always read 0 for FS tool calls (mid-session-audit
//   queries by real session ID, found nothing). Transport-invariant: both stdio and
//   HTTP companion paths go through McpController so single fix covers both.
//   Fix: resolve via telemetryService.readActiveSessionId() -- same JDBC transport-
//   agnostic active_session read used by D1/D3/D4 in ContextServerClient. Falls back
//   to 'unknown' if DB unavailable. knownhash_pct now reflects real unchanged-file hits.
// v0.8.64: Tool hint clarity -- knownHash verbose description updated for action=range
//   and action=get_method to explicitly state ZERO-TOKEN unchanged short-circuit behaviour.
//   KNOWNHASH PATTERN line added to verbose description. Compact hint updated to list
//   all supported actions (read|range|get_method|list). inputSchema knownHash property
//   description now documents both hash sources and within-session chaining pattern.
// v0.8.63: CT-66b..CT-69 bare-box-drawing-at-line-start contracts + FS-T10 check.
//   Root cause (G1 session): multi_replace oldText ended mid-section-divider, leaving
//   trailing \u2500\u2500\u2500 chars without // prefix -> Groovy 'Unexpected character'.
//   Fix: checkBareBoxDrawing() runs on simulated result for .groovy/.java/.kt files
//   before atomicWrite in both doReplace and doMultiReplace. Returns structured error
//   with bare_box_drawing_hint if any line starts with U+2500..U+257F outside a comment.
//   .txt/.md/.adoc exempt. CT-67 (correct // prefix passes) + CT-69 (.txt exempt) green.
// v0.8.62: CT-64..CT-65 non-ASCII oldText contracts. CT-64: replace where oldText contains
//   non-ASCII chars (e.g. section-sign U+00A7 in doc comments) returns toolError with
//   non_ascii_hint field directing use of action=patch. CT-65: ASCII-only not-found omits
//   non_ascii_hint (no false positives). Root cause: G4 session AwToCsSignalClient
//   resolveActiveSession() doc comment had \u00a7 in oldText -- FS correctly blocked it.
//   Behaviour was already correct; contracts added to lock it in. 112 tests total.
// v0.8.61: CT-59..CT-63 replace contract tests (happy-path, multi-match ambiguity, no-hash degraded
//   safety, multi_replace happy-path, missing-file guard). FileReplaceService.doReplace: Files.exists()
//   check added before Files.size() -- missing file now returns toolError instead of uncaught
//   NoSuchFileException (CT-63). CT-60 spec assertion updated to match FS actual wording
//   ('appears N times / must be unique'). Practice #433. 110 tests total, all green.
// v0.8.60: CT-54..CT-58 from log analysis 2026-04-16. doGetMethod: add isFile() guard before hash-check (was missing -- directory paths returned 'method not found' instead of toolError). CT-57: patch without expectedHash confirmed working (degraded safety). CT-54/55/56: grep/read/range on dir already toolError-safe -- contracts added to lock that in. URLClassLoader fix: use Thread.currentThread().contextClassLoader as parent (not null) so java.sql.Driver is visible to sqlite-jdbc driver loaded in isolated CL.
// v0.8.58: MCP-EFFICIENCY-BUILD-BRIEF-V1 Turn 4 -- New-3: _tok estimate injected into every textResponse payload (Map payloads only, chars/4). AbstractFileService.textResponse enriched. CT-32: append_section wrong option name returns structured error. FileContractSpec 32 tests. Practice #424 (section transforms use content not newContent). MCP-EFFICIENCY-BUILD-BRIEF-V1 Turn 2 -- Fix C (get_method now records real startLine/endLine to range cache, parseResponsePayload helper added). CT-30 (server_transform extension guard), CT-31 (replace_method wrong option name). Practice #422 (replace_method requires newBody not newMethod). file_search wrong-path error diagnosed (Claude bad path, not FS bug). MCP-EFFICIENCY-BUILD-BRIEF-V1 Fix E -- InsertBeforeMatchTransformer: matchLast=true (alias for occurrence=-1) and fromLine=N (1-based, skip occurrences before line N) options. Both compose: fromLine restricts window first, matchLast/occurrence resolves within window. FileContractSpec CT-27 (matchLast targets last occurrence), CT-28 (fromLine skips early occurrences), CT-29 (combined matchLast+fromLine) -- 74 tests total. FS-F6 fix -- FileWriteService generic catch(Exception) now wraps error in JsonBuilder([success:false,error:msg,action:...]) so all tool-level exceptions return parseable JSON, not raw strings. FileContractSpec CT-24 (large-file replace returns structured response), CT-25 (top-level oldText/newText promotion succeeds), CT-26 (multi_replace missing replacements returns structured error) -- all 71 tests pass.
// v0.8.59: CT-33..CT-53 contract tests (checksum/stat/exists/diff/write/append/head/tail/info/grep -- 21 new, total 100).
//   Idea #62: file_read action=multi with knownHashes or compact=true now exempt from BLOCKED_UNRANGED_INDEXED_READ guard.
//   Idea #16: server_transform insert_before_match -- options.matchIsRegex=true compiles match as Pattern.find() not contains().
//   copyToJarsDir: auto-updates mcp-http-servers.json jar ref + server_versions in best_practices.db on every deploy.
// v0.8.54: Fix D -- action=multi guard for unranged ontology-indexed files (ContextServerClient.isOntologyIndexed, FileReadService BLOCKED_UNRANGED_INDEXED_READ per-path).
//   Fix F FS -- ContextServerClient.invalidateFileAsync (POST /invalidate), FileWriteService post-write invalidation hook.
//   Fix #52 -- ReplaceMethodTransformer signature validation (CT-17 now green). FileContractSpec CT-23: 23/23 pass.
// v0.8.53: Fix C -- session-scoped range read cache intercept (ContextServerClient.checkRangeCache/recordRangeCacheAsync,
//   FileReadService range+get_method cache check/record). CT-19..CT-23 added to FileContractSpec (all pass).
//   CT-17 pre-existing failure logged to idea #52 (ReplaceMethodTransformer signature validation missing).
// v0.8.52: McpResponse.error() renamed to protocolError() -- compiler-enforced + spec-enforced contract.
//   McpController + HttpMcpController updated to call protocolError().
//   ServiceErrorContractSpec rewritten (v0.8.52): 4 tests, fully recursive via Files.walkFileTree.
//     Test 1: McpResponse.error() must not exist anywhere (compile-level removal).
//     Test 2: McpResponse.protocolError() must not appear in non-controller service files.
//     Test 3: controller files exist and actually use protocolError() (exclusion is real).
//     Test 4: src/main/groovy accessible + non-empty (guards vacuous scan on CWD drift).
//   findProjectRoot() resolves project root by walking up to build.gradle -- no fragile CWD reliance.
//   TDD: 61 tests, 0 failures, 0 skipped.
// v0.8.51: ServiceErrorContractSpec -- static analysis contract test added. Walks src/main/groovy
//          recursively via Files.walkFileTree, asserts zero matches of McpResponse.error(requestId,-326xx)
//          in service handlers. Excludes McpController.groovy + HttpMcpController.groovy (protocol level,
//          correct). Prevents silent re-introduction of swallowed errors in any future edit.
//          TDD: 59 tests, 0 failures, 0 skipped (+2: zero-violations scan + exclusions sanity check).
// v0.8.50: RCA-1 COMPLETION -- bulk McpResponse.error(requestId,-326xx) -> toolError() across 14 service
//          files (92 replacements). v0.8.48 claimed this fix but only converted a subset of call sites;
//          the remainder were silently left as JSON-RPC error objects that Claude Desktop swallows
//          (DT renders protocol-level errors as opaque 'Tool execution failed' with no message body).
//          Root cause of incomplete 0.8.48 fix: the fix was applied manually file-by-file using
//          server_transform/multi_replace with too-narrow scope; deep service subpackages
//          (ExecuteService, ToolsService, FileChunkWriter, FileContentReader, FileMetaReader,
//          FileStructureReader, ReadResponseHelper, OfficeDocumentHandler) were missed entirely.
//          Fix verified via Python bulk regex replace + post-scan clean check. 92 occurrences in 14 files.
//          McpController.groovy + HttpMcpController.groovy excluded (correct to use .error() for
//          protocol-level dispatch). FileReplaceService already clean from 0.8.48.
//          TDD: FileContractSpec CT-1..CT-15 preserved; CT-16 added (containment overlap surfacing).
//          FileServicesSmokeSpec: chunk_status unknown-session test updated to isError:true contract.
// v0.8.49: Fix F extended -- FilePatchService brace delta check now covers ALL mid-file
//          .groovy/.java patches, not just boundary patches. New algorithm: per-replacement
//          brace delta check (removedLines delta must equal newText delta). Catches the exact
//          failure mode where a patch removes 'if (!x) {\n body' (delta +1) but replaces
//          with flat content (delta 0), orphaning the closing } in the surrounding scope.
//          TDD: CT-14 (delta mismatch blocked) + CT-15 (balanced replacement passes). Full
//          suite CT-1..CT-15 green. Root cause of PipelineExecutionService corruption session.
// v0.8.48: RCA-1 McpResponse.toolError() -- all tool handler errors now return isError:true content (not JSON-RPC error object); Claude Desktop was silently swallowing -326xx errors. RCA-2 doMultiReplace: suffix/prefix partial overlap detection + simulation pass before apply (entry-makes-entry-unfindable fails whole batch). RCA-3 requires_reread:true on boundary patches (startLine==1 OR endLine==last); recentPatches only updated after successful write. RCA-5 doMultiReplace applies in reverse position order. RCA-6 FileTransformService all errors via toolError. RCA-7 checkBraceBalance runs on simulated result BEFORE atomicWrite. RCA-8 legacy specs updated to new isError:true contract. TDD: FileContractSpec CT-1..CT-13 all green.
// v0.8.47: Fix A'' -- positionalReplace in doReplace/doMultiReplace: unicode NFC/NFKC normalisation now uses per-position replace so only the matched region is rewritten, not the whole file (ideation #35). Fix B -- per-entry normalisation tracking in doMultiReplace: each entry independently resolved, no global NFKC clobber of ASCII entries. Fix C -- sequential boundary patch (endLine==EOF) within 60s now BLOCKED with clear error. Fix D -- lines_shifted added to all patch responses. Fix E -- tail_content (last 5 lines) included in boundary patch responses. Fix F -- pre-apply brace balance check for .groovy/.java boundary patches. Fix G -- removed_lines snippet in patch response.
// v0.8.46: FS-T6 -- doPatch empty/missing options.replacements now returns textResponse([error:..., hint:...]) instead of McpResponse.error(-32602). DT was rendering -32602 as opaque 'Tool execution failed' rather than showing the message. textResponse wraps in MCP content block so DT shows the error map as readable text.
// v0.8.44: FS-T7: FileStructureReader.doGetMethod() surfaces fallback:true + fallback_note when regex scanner used (AST compile error). FS-T8: ChunkBufferService.getWriteChunkStatus() + FileChunkWriter.doChunkStatus() + FileWriteService action=chunk_status -- returns receivedChunks/missingChunks/ready:bool so callers can verify all chunks arrived before finalise_write.
// v0.8.42: ContextServerClient.resolveSessionId() fix -- null result from JDBC no longer cached (was blocking retries). HTTP fallback log message clarified as expected-in-MCPB. resolveSessionId() now retries JDBC on every call until active_session row exists. Fixes session_working_files always getting session_id='unknown' in MCPB mode.
// v0.8.41: ServerLifecycleService.doEnsure() early-exit via isPortListening(port,1,0) before startServer. ContextServerClient @PostConstruct eagerResolveSessionId() — async session ID prime at startup eliminates 'new session unknown' log spam. FileReplaceService new replace-threshold-kb=150 separate property. FileReadService unknown-action error lists valid actions. ExecuteService workingDir error shows allowed dirs.
// v0.8.40: Fix Unicode corruption on stdio transport. Two changes: (1) StdioMcpServer.groovy -- InputStreamReader(System.in) now uses explicit StandardCharsets.UTF_8 (was JVM default Cp1252 on Windows, corrupted U+2192 and other non-Latin-1 chars in tool params causing file_write replace to fail silently). (2) McpGroovyFileSystemServerApplication.main() -- System.setOut(PrintStream UTF-8) so JsonRpcWriter output also encodes Unicode correctly.
// v0.8.35: FileReplaceService replace+multi_replace: add NFKC normalisation fallback after NFC (handles em-dash/en-dash variants, smart quotes). Fix contradictory error guidance -- patch is now correctly recommended when oldText contains non-ASCII. See practice #214.
// v0.8.33: replace_section headingStyle=text for arbitrary anchor matching in source files
// v0.8.31: BUGFIX ServerLifecycleService.startServer() now passes -Dspring.profiles.active=http + -DMCP_MODE=http to ProcessBuilder cmd. Without these, HTTP companion processes inherited/defaulted to stdio profile, binding no port and running as useless duplicate stdio processes.
// v0.8.25 fixed the create directory under missing parent problem
// v0.8.23: file_list action=list returns listing_hash + knownHash short-circuit (parity with file_read action=list)
// v0.8.22: fix multi_grep path guard; SKILL.md/CLAUDE.md/USAGE.md/README doc sync
// v0.8.22: fix multi_grep path guard — add multi_grep to path-exempt action list so it works without a path param
// v0.8.21: file_read action=list returns listing_hash + knownHash short-circuit; file_list action=list wired to listing cache; file_read action=multi_grep — grep one pattern across options.paths[] in one call
// v0.8.18: Toon encoding support on file_read action=list (toon=true in options)
// v0.8.13: ServerLifecycleService port-conflict race fix — killStalePidIfPresent guards on isPortListening + retry loop; HttpMcpController session-id poll noise already at DEBUG
// v0.8.12: OfficeDocumentHandler DSL bridge — XlsxAdapter/DocxAdapter/PptxAdapter via GCU; legacy flat-map paths preserved
// v0.8.11: OfficeDocumentHandler - read_office/write_office actions for .xlsx/.docx/.pptx via Apache POI; wired into FileReadService + FileWriteService dispatch
// v0.8.10: @PostConstruct autoStartHttpCompanions — servers with autoHttpCompanion:true in mcp-http-servers.json start as HTTP child processes when filesystem stdio server starts; killed cleanly on DT/CC exit via existing stopAllOnShutdown()
// v0.8.9: CODE-DEFECT-004 ContextServerClient liveness guard (contextServerReachable flag, ConnectException silenced after first hit); SKILL-UPDATE-004 server_transform file-type guard with descriptive error for non-Groovy/Java targets
// v0.8.8: Fix mkdirs boolean cast — Boolean.valueOf(toString()) not 'as boolean' under @CompileStatic
// v0.8.7: Fix mkdirs silent failure — WriteUtils.atomicWrite redundant !Files.exists guard raced with createDirectories
// v0.8.5: Streamable HTTP transport (POST /mcp + GET /mcp SSE) — HttpMcpController; keeps legacy McpSseController for backward compat
// v0.7.50: Fix sanitize() stripping non-ASCII Unicode (em-dashes, smart quotes, accented chars) - removed \p{Print} filter that only matched ASCII; added NFC normalization fallback in replace/multi_replace; normalized oldText line endings in doReplace
// v0.7.49: ContextServerClient postToContextServer+postWithTimeout endpoint / -> /mcp (fixes 404 on file-structure registry calls)

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    springAiVersion = '1.1.2'
    groovyVersion = '5.0.4'
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'  // /actuator/health for startup probe
    
    // Jackson (for JSON serialization)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Spring AI MCP
    implementation "org.springframework.ai:spring-ai-mcp:${springAiVersion}"
    
    // Jakarta Annotations
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    
    // Groovy
    implementation "org.apache.groovy:groovy:${groovyVersion}"
    implementation "org.apache.groovy:groovy-json:${groovyVersion}"
    implementation "org.apache.groovy:groovy-nio:${groovyVersion}"
    implementation "org.apache.groovy:groovy-templates:${groovyVersion}"
    
    // Logging
    implementation 'ch.qos.logback:logback-classic'
    
    // SQLite - shared persistence with context server
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    // Toon token-optimised notation encoding
    implementation 'com.woodmawa.mcp.toon:mcp-toon-service:1.0-SNAPSHOT'

    // Apache POI - Office document read/write (.xlsx, .docx, .pptx)
    // Used by OfficeDocumentHandler for read_office / write_office tool actions
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // GroovyConcurrentUtils - XlsxAdapter/DocxAdapter/PptxAdapter DSL bridge
    implementation 'org.softwood:GroovyConcurrentUtils:1.1.1'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.apache.groovy:groovy-test:${groovyVersion}"
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// =============================================================================
// MCPB Desktop Extension Packaging
// =============================================================================
// Produces a .mcpb (MCP Bundle) file for installation in Claude Desktop via the
// extension registry — eliminating reliance on the hand-edited mcpServers JSON
// block that Cowork clobbers on restart.
//
// Tasks:
//   generateMcpbManifest  — writes manifest.json into build/mcpb-staging/
//   stageJarForMcpb       — copies bootJar into build/mcpb-staging/server/
//   packageMcpbThin       — ZIPs staging dir → build/distributions/*.mcpb
//   copyMcpbToSync        — copies thin .mcpb to claude-sync/extensions/
//   installMcpbLocal      — installs directly into DT extension cache (requires restart)
//
// Usage:
//   ./gradlew packageMcpbThin installMcpbLocal   — full build + install into DT
//   ./gradlew copyMcpbToSync                     — copy to claude-sync for manual install
// =============================================================================

import groovy.json.JsonOutput

def mcpbStagingDir   = layout.buildDirectory.dir('mcpb-staging').get().asFile
def mcpbOutputDir    = layout.buildDirectory.dir('distributions').get().asFile
def claudeSyncExtDir = file('C:/Users/willw/claude-sync/extensions')
def claudeSyncDir    = file('C:/Users/willw/claude-sync')

// JVM args — mirrors current DT config args exactly
def fsJvmArgs = [
    '--enable-native-access=ALL-UNNAMED',
    '-XX:+IgnoreUnrecognizedVMOptions',
    '-Dspring.profiles.active=stdio',
    '-Dmcp.filesystem.allowed-directories=C:/Users/willw/IdeaProjects, C:/Users/willw/claude, C:/Users/willw/AppData/Roaming/Claude, C:/Users/willw/claude-sync, C:/Users/willw/.claude, C:/Users/willw/alumniserve, C:/Users/willw/OneDrive',
    '-Dmcp.script.enable-python=true',
    '-Dmcp.script.python-home=C:/python314',
    // Required for FilesystemTelemetryService and pending_reindex queue (ontology reindex fallback)
    '-Dmcp.usage.db-path=C:/Users/willw/claude-sync/best_practices.db'
]
// ─── generateMcpbManifest ────────────────────────────────────────────────────

tasks.register('generateMcpbManifest') {
    group       = 'mcpb'
    description = 'Generates manifest.json for the thin MCPB bundle into build/mcpb-staging/'

    dependsOn bootJar

    inputs.property('version', project.version)
    outputs.file("${mcpbStagingDir}/manifest.json")

    doFirst {
        mcpbStagingDir.mkdirs()
        new File(mcpbStagingDir, 'server').mkdirs()
    }

    doLast {
        String dxtVersion = project.findProperty('mcpb.dxt.version')
            ?: { throw new GradleException("mcpb.dxt.version not set in gradle.properties") }()

        String jarName = "${project.name}-${project.version}.jar"
        List<String> args = fsJvmArgs + [
            '-jar',
            '${__dirname}/server/' + jarName
        ]

        Map manifest = [
            dxt_version : dxtVersion,
            name        : project.name,
            version     : project.version as String,
            description : 'Filesystem MCP server — file read/write, search, structure, server-side transforms, server lifecycle management',
            author      : [
                name  : 'Will Woodman',
                email : 'willw@softwood.co.uk'
            ],
            server      : [
                type        : 'binary',
                entry_point : 'server/' + jarName,
                mcp_config  : [
                    command : 'java',
                    args    : args
                ]
            ],
            compatibility : [
                platforms : ['win32']
            ],
            tools : [
                [name: 'file_read',       description: 'Read files and directories — read, head, tail, range, grep, structure, list and more'],
                [name: 'file_write',      description: 'Write and modify files — write, append, patch, multi_replace, server_transform'],
                [name: 'file_search',     description: 'Search file contents or filenames by regex'],
                [name: 'server_lifecycle', description: 'Manage HTTP MCP server processes — start, stop, status, ensure, reload']
            ]
        ]

        def manifestFile = new File(mcpbStagingDir, 'manifest.json')
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest))
        logger.lifecycle("MCPB: manifest.json written → ${manifestFile}")
    }
}

