plugins {
    id 'groovy'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

/**
 * Token optimisation: tighter tool descriptions, slim pathToMap, relative tree paths,
 * compact response mode, compact and verbose options, compress large payloads
 */
group = 'com.softwood'
version = '0.9.6'
// See CHANGELOG.md in project root for full version history.

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    springAiVersion = '1.1.2'
    groovyVersion = '5.0.4'
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'  // /actuator/health for startup probe
    
    // Jackson (for JSON serialization)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Spring AI MCP
    implementation "org.springframework.ai:spring-ai-mcp:${springAiVersion}"
    
    // Jakarta Annotations
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    
    // Groovy
    implementation "org.apache.groovy:groovy:${groovyVersion}"
    implementation "org.apache.groovy:groovy-json:${groovyVersion}"
    implementation "org.apache.groovy:groovy-nio:${groovyVersion}"
    implementation "org.apache.groovy:groovy-templates:${groovyVersion}"
    
    // Logging
    implementation 'ch.qos.logback:logback-classic'
    
    // SQLite - shared persistence with context server
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    // Toon token-optimised notation encoding
    implementation 'com.woodmawa.mcp.toon:mcp-toon-service:1.0-SNAPSHOT'

    // Apache POI - Office document read/write (.xlsx, .docx, .pptx)
    // Used by OfficeDocumentHandler for read_office / write_office tool actions
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // GroovyConcurrentUtils - XlsxAdapter/DocxAdapter/PptxAdapter DSL bridge
    implementation 'org.softwood:GroovyConcurrentUtils:1.1.1'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.apache.groovy:groovy-test:${groovyVersion}"
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// =============================================================================
// MCPB Desktop Extension Packaging
// =============================================================================
// Produces a .mcpb (MCP Bundle) file for installation in Claude Desktop via the
// extension registry — eliminating reliance on the hand-edited mcpServers JSON
// block that Cowork clobbers on restart.
//
// Tasks:
//   generateMcpbManifest  — writes manifest.json into build/mcpb-staging/
//   stageJarForMcpb       — copies bootJar into build/mcpb-staging/server/
//   packageMcpbThin       — ZIPs staging dir → build/distributions/*.mcpb
//   copyMcpbToSync        — copies thin .mcpb to claude-sync/extensions/
//   installMcpbLocal      — installs directly into DT extension cache (requires restart)
//
// Usage:
//   ./gradlew packageMcpbThin installMcpbLocal   — full build + install into DT
//   ./gradlew copyMcpbToSync                     — copy to claude-sync for manual install
// =============================================================================

import groovy.json.JsonOutput

def mcpbStagingDir   = layout.buildDirectory.dir('mcpb-staging').get().asFile
def mcpbOutputDir    = layout.buildDirectory.dir('distributions').get().asFile
def claudeSyncExtDir = file('C:/Users/willw/claude-sync/extensions')
def claudeSyncDir    = file('C:/Users/willw/claude-sync')

// JVM args — mirrors current DT config args exactly
def fsJvmArgs = [
    '--enable-native-access=ALL-UNNAMED',
    '-XX:+IgnoreUnrecognizedVMOptions',
    '-Dspring.profiles.active=stdio',
    '-Dmcp.filesystem.allowed-directories=C:/Users/willw/IdeaProjects, C:/Users/willw/claude, C:/Users/willw/AppData/Roaming/Claude, C:/Users/willw/claude-sync, C:/Users/willw/.claude, C:/Users/willw/alumniserve, C:/Users/willw/OneDrive',
    '-Dmcp.script.enable-python=true',
    '-Dmcp.script.python-home=C:/python314',
    // Required for FilesystemTelemetryService and pending_reindex queue (ontology reindex fallback)
    '-Dmcp.usage.db-path=C:/Users/willw/claude-sync/best_practices.db'
]
// ─── generateMcpbManifest ────────────────────────────────────────────────────

tasks.register('generateMcpbManifest') {
    group       = 'mcpb'
    description = 'Generates manifest.json for the thin MCPB bundle into build/mcpb-staging/'

    dependsOn bootJar

    inputs.property('version', project.version)
    outputs.file("${mcpbStagingDir}/manifest.json")

    doFirst {
        mcpbStagingDir.mkdirs()
        new File(mcpbStagingDir, 'server').mkdirs()
    }

    doLast {
        String dxtVersion = project.findProperty('mcpb.dxt.version')
            ?: { throw new GradleException("mcpb.dxt.version not set in gradle.properties") }()

        String jarName = "${project.name}-${project.version}.jar"
        List<String> args = fsJvmArgs + [
            '-jar',
            '${__dirname}/server/' + jarName
        ]

        Map manifest = [
            dxt_version : dxtVersion,
            name        : project.name,
            version     : project.version as String,
            description : 'Filesystem MCP server — file read/write, search, structure, server-side transforms, server lifecycle management',
            author      : [
                name  : 'Will Woodman',
                email : 'willw@softwood.co.uk'
            ],
            server      : [
                type        : 'binary',
                entry_point : 'server/' + jarName,
                mcp_config  : [
                    command : 'java',
                    args    : args
                ]
            ],
            compatibility : [
                platforms : ['win32']
            ],
            tools : [
                [name: 'file_read',       description: 'Read files and directories — read, head, tail, range, grep, structure, list and more'],
                [name: 'file_write',      description: 'Write and modify files — write, append, patch, multi_replace, server_transform'],
                [name: 'file_search',     description: 'Search file contents or filenames by regex'],
                [name: 'server_lifecycle', description: 'Manage HTTP MCP server processes — start, stop, status, ensure, reload']
            ]
        ]

        def manifestFile = new File(mcpbStagingDir, 'manifest.json')
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest))
        logger.lifecycle("MCPB: manifest.json written → ${manifestFile}")
    }
}

// ─── stageJarForMcpb ─────────────────────────────────────────────────────────

tasks.register('stageJarForMcpb', Copy) {
    group       = 'mcpb'
    description = 'Copies the bootJar into build/mcpb-staging/server/'

    dependsOn bootJar, generateMcpbManifest

    from(bootJar.outputs.files)
    into("${mcpbStagingDir}/server")
}

// ─── packageMcpbThin ─────────────────────────────────────────────────────────

tasks.register('packageMcpbThin', Zip) {
    group       = 'mcpb'
    description = 'Packages a thin MCPB bundle (JAR only — requires java on PATH/JAVA_HOME)'

    dependsOn stageJarForMcpb

    from(mcpbStagingDir)
    destinationDirectory = mcpbOutputDir
    archiveFileName      = "${project.name}-${project.version}-thin.mcpb"

    doLast {
        logger.lifecycle("MCPB thin bundle → ${mcpbOutputDir}/${archiveFileName.get()}")
    }
}

// ─── copyMcpbToSync ──────────────────────────────────────────────────────────

tasks.register('copyMcpbToSync', Copy) {
    group       = 'mcpb'
    description = 'Copies the thin .mcpb to C:/Users/willw/claude-sync/extensions/ for manual DT install'

    dependsOn packageMcpbThin

    from(mcpbOutputDir) {
        include "${project.name}-${project.version}-thin.mcpb"
    }
    into(claudeSyncExtDir)

    doFirst  { claudeSyncExtDir.mkdirs() }
    doLast   { logger.lifecycle("MCPB copied to claude-sync/extensions/ — double-click to install in DT") }
}

// ─── killHttpCompanions ───────────────────────────────────────────────────────
// Reads mcp-http-servers-runtime.json and kills HTTP companion PIDs only.
// Critically: reads stdioPid from the file and NEVER kills it.
// Safe to run while DT is open -- only HTTP child processes are affected.

tasks.register('killHttpCompanions') {
    group       = 'mcpb'
    description = 'Kill HTTP companion processes (from runtime JSON) without touching stdio JVMs'

    doLast {
        def runtimeFile = new File(claudeSyncDir, 'mcp-http-servers-runtime.json')
        if (!runtimeFile.exists()) {
            logger.lifecycle('killHttpCompanions: no runtime file found, nothing to kill')
            return
        }
        def slurper = new groovy.json.JsonSlurper()
        def state   = slurper.parse(runtimeFile) as Map

        // Build protected PID set from EITHER format:
        //   v1 (old): state.stdioPid (Long)  -- written by ServerLifecycleService pre-0.8.34
        //   v2 (new): state.stdioJvmPids (Map<name,pid>) -- written by ServerLifecycleService 0.8.34+
        //             OR per-entry srv.stdioPid -- written by ServerLifecycleService 0.8.34+
        Set<Long> protectedPids = new HashSet<Long>()
        if (state.stdioPid) protectedPids.add(state.stdioPid as Long)
        if (state.stdioJvmPids instanceof Map) {
            (state.stdioJvmPids as Map).values().each { protectedPids.add(it as Long) }
        }

        List servers = state.managedServers as List ?: []
        if (!servers) { logger.lifecycle('killHttpCompanions: no managed servers in runtime file'); return }

        servers.each { srv ->
            long pid = (srv.pid as Long) ?: 0L
            if (pid <= 0) { logger.lifecycle("killHttpCompanions: ${srv.name} has no PID, skipping"); return }
            // Also collect per-entry stdioPid (v1 server_lifecycle format)
            if (srv.stdioPid) protectedPids.add(srv.stdioPid as Long)
            if (protectedPids.contains(pid)) {
                logger.error("killHttpCompanions: REFUSING to kill PID ${pid} for ${srv.name} -- is a protected stdio JVM")
                return
            }
            try {
                def ph = ProcessHandle.of(pid)
                if (ph.isPresent() && ph.get().isAlive()) {
                    ph.get().destroyForcibly()
                    logger.lifecycle("killHttpCompanions: killed ${srv.name} HTTP companion PID ${pid} (jar=${srv.jar ?: 'unknown'})")
                } else {
                    logger.lifecycle("killHttpCompanions: ${srv.name} PID ${pid} already dead")
                }
            } catch (Exception e) {
                logger.warn("killHttpCompanions: failed to kill ${srv.name} PID ${pid}: ${e.message}")
            }
        }
    }
}

// ─── installMcpbLocal ────────────────────────────────────────────────────────
// Installs manifest.json + jar directly into the DT extension cache directory.
// With version bump: new jar installs alongside locked old jar (different filename).
// Old jar deleted on next DT restart. Safe to run while DT is open IF version changed.
// Requires a DT restart to pick up changes.

tasks.register('installMcpbLocal') {
    group       = 'mcpb'
    description = 'Kills HTTP companions, installs jar+manifest into DT extension cache (requires DT restart)'

    dependsOn stageJarForMcpb

    doFirst {
        // Kill HTTP companion processes before install so their jar handles are released.
        // This does NOT kill the stdio JVM -- stdioPid guard in killHttpCompanions prevents it.
        tasks.named('killHttpCompanions').get().actions.each { it.execute(tasks.named('killHttpCompanions').get()) }
    }

    doLast {
        def dtExtDir  = file("$System.env.APPDATA/Claude/Claude Extensions/local.mcpb.will-woodman.${project.name}")
        def serverDir = new File(dtExtDir, 'server')
        serverDir.mkdirs()
        serverDir.listFiles()?.each { f ->
            if (f.name.endsWith('.jar')) {
                if (f.delete()) { logger.lifecycle("MCPB: removed stale jar ${f.name}") }
                else { logger.warn("MCPB: WARNING — could not delete ${f.name} (close DT before deploying)") }
            }
        }
        java.nio.file.Files.copy(new File(mcpbStagingDir, 'manifest.json').toPath(),
            new File(dtExtDir, 'manifest.json').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        String jarName = "${project.name}-${project.version}.jar"
        java.nio.file.Files.copy(new File(mcpbStagingDir, "server/${jarName}").toPath(),
            new File(serverDir, jarName).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("MCPB: install complete — restart DT to activate v${project.version}")

        // Update extensions-installations.json (DT metadata cache — practice #190)
        def installsFile = new File("$System.env.APPDATA/Claude/extensions-installations.json")
        try {
            def mcpbFile = new File(mcpbOutputDir, "${project.name}-${project.version}-thin.mcpb")
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            mcpbFile.eachByte(8192) { byte[] buf, int len -> digest.update(buf, 0, len) }
            String mcpbHash = digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
            def slurper = new groovy.json.JsonSlurper()
            Map installs = installsFile.exists() ? (slurper.parse(installsFile) as Map) : [extensions: [:]]
            if (!installs.extensions) installs.extensions = [:]
            def manifest = slurper.parse(new File(mcpbStagingDir, 'manifest.json'))
            String extId = "local.mcpb.will-woodman.${project.name}"
            installs.extensions[extId] = [
                id: extId, version: project.version as String, hash: mcpbHash,
                installedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"),
                manifest: manifest, signatureInfo: [status: 'unsigned'], source: 'local'
            ]
            installsFile.text = groovy.json.JsonOutput.toJson(installs)
            logger.lifecycle("MCPB: updated extensions-installations.json -> v${project.version}")
        } catch (Exception e) {
            logger.warn("MCPB: WARNING — could not update extensions-installations.json: ${e.message}")
        }
    }
}

// --- copyToJarsDir -------------------------------------------------------
// Copies the built jar to claude-sync/jars/ so HTTP companion mode works
// after a DT restart. installMcpbLocal copies to the DT Extensions dir
// (for stdio transport) but NOT to jars/ (for HTTP companion transport).
// Without this, server_lifecycle ensure fails with jar-not-found after restart.
// Added: 2026-04-03 (practice #248)

tasks.register('copyToJarsDir') {
    group       = 'mcpb'
    description = 'Copies built jar to claude-sync/jars/ for HTTP companion mode after DT restart'

    doLast {
        def jarsDir = new File(claudeSyncDir, 'jars')
        jarsDir.mkdirs()
        def jar = new File(layout.buildDirectory.dir('libs').get().asFile, "${project.name}-${project.version}.jar")
        if (jar.exists()) {
            def dest = new File(jarsDir, jar.name)
            java.nio.file.Files.copy(jar.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("JARS: copied ${jar.name} -> claude-sync/jars/")
        } else {
            logger.warn("JARS: WARNING -- jar not found at ${jar.path}, skipping copy")
        }

        // Update mcp-http-servers.json jar reference so HTTP companion always starts
        // from the newly deployed jar without a manual fix after each deploy.
        // Replaces any previous mcp-groovy-filesystem-server-*.jar entry for the filesystem server.
        def httpServersFile = new File(claudeSyncDir, 'mcp-http-servers.json')
        try {
            if (httpServersFile.exists()) {
                String jsonText = httpServersFile.text
                // Replace old jar filename for filesystem server only (leaves other server entries untouched)
                String updated = jsonText.replaceAll(
                    /"jar":\s*"mcp-groovy-filesystem-server-[^"]+\.jar"/,
                    "\"jar\": \"${jar.name}\""
                )
                if (updated != jsonText) {
                    httpServersFile.text = updated
                    logger.lifecycle("HTTP-CFG: mcp-http-servers.json updated -> ${jar.name}")
                } else {
                    logger.warn("HTTP-CFG: WARNING -- jar entry for filesystem not found in mcp-http-servers.json, check manually")
                }
            } else {
                logger.warn("HTTP-CFG: WARNING -- mcp-http-servers.json not found at ${httpServersFile.path}")
            }
        } catch (Exception e) {
            logger.warn("HTTP-CFG: WARNING -- could not update mcp-http-servers.json: ${e.message}")
        }

        // Update server_versions in best_practices.db so session-bootstrap reports correct
        // version immediately on first run after DT restart. Removes manual context_write step.
        if (jar.exists()) {
            def dbPath = 'C:/Users/willw/claude-sync/best_practices.db'
            try {
                // Load sqlite-jdbc from resolved runtime classpath -- avoids buildscript classpath issue
                def sqliteJar = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                    .find { it.name == 'sqlite-jdbc' }?.file
                if (!sqliteJar) throw new IllegalStateException('sqlite-jdbc jar not found in runtimeClasspath')
                // Use thread context classloader as parent so java.sql.* is visible to the driver
                def sqliteCl = new URLClassLoader([sqliteJar.toURI().toURL()] as URL[],
                    Thread.currentThread().contextClassLoader)
                def driverClass = Class.forName('org.sqlite.JDBC', true, sqliteCl)
                def driver = driverClass.getDeclaredConstructor().newInstance()
                def props = new java.util.Properties()
                def conn = (driver as java.sql.Driver).connect("jdbc:sqlite:${dbPath}", props)
                def ps = conn.prepareStatement(
                    "INSERT OR REPLACE INTO server_versions (server_name, version, jar_path, updated_at) " +
                    "VALUES ('filesystem', ?, ?, datetime('now'))")
                ps.setString(1, project.version as String)
                ps.setString(2, new File(claudeSyncDir, "jars/${jar.name}").absolutePath)
                ps.executeUpdate()
                ps.close(); conn.close()
                logger.lifecycle("DB: server_versions updated filesystem -> ${project.version}")
            } catch (Exception e) {
                logger.warn("DB: WARNING -- could not update server_versions: ${e.message}")
            }
        }
    }
}

tasks.named('installMcpbLocal').configure { finalizedBy 'copyToJarsDir' }
