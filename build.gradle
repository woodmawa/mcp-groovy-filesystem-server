plugins {
    id 'groovy'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

/**
 * Token optimisation: tighter tool descriptions, slim pathToMap, relative tree paths,
 * compact response mode, compact and verbose options, compress large payloads
 */
group = 'com.softwood'
version = '0.8.29'
// v0.8.25 fixed the create directory under missing parent problem
// v0.8.23: file_list action=list returns listing_hash + knownHash short-circuit (parity with file_read action=list)
// v0.8.22: fix multi_grep path guard; SKILL.md/CLAUDE.md/USAGE.md/README doc sync
// v0.8.22: fix multi_grep path guard — add multi_grep to path-exempt action list so it works without a path param
// v0.8.21: file_read action=list returns listing_hash + knownHash short-circuit; file_list action=list wired to listing cache; file_read action=multi_grep — grep one pattern across options.paths[] in one call
// v0.8.18: Toon encoding support on file_read action=list (toon=true in options)
// v0.8.13: ServerLifecycleService port-conflict race fix — killStalePidIfPresent guards on isPortListening + retry loop; HttpMcpController session-id poll noise already at DEBUG
// v0.8.12: OfficeDocumentHandler DSL bridge — XlsxAdapter/DocxAdapter/PptxAdapter via GCU; legacy flat-map paths preserved
// v0.8.11: OfficeDocumentHandler - read_office/write_office actions for .xlsx/.docx/.pptx via Apache POI; wired into FileReadService + FileWriteService dispatch
// v0.8.10: @PostConstruct autoStartHttpCompanions — servers with autoHttpCompanion:true in mcp-http-servers.json start as HTTP child processes when filesystem stdio server starts; killed cleanly on DT/CC exit via existing stopAllOnShutdown()
// v0.8.9: CODE-DEFECT-004 ContextServerClient liveness guard (contextServerReachable flag, ConnectException silenced after first hit); SKILL-UPDATE-004 server_transform file-type guard with descriptive error for non-Groovy/Java targets
// v0.8.8: Fix mkdirs boolean cast — Boolean.valueOf(toString()) not 'as boolean' under @CompileStatic
// v0.8.7: Fix mkdirs silent failure — WriteUtils.atomicWrite redundant !Files.exists guard raced with createDirectories
// v0.8.5: Streamable HTTP transport (POST /mcp + GET /mcp SSE) — HttpMcpController; keeps legacy McpSseController for backward compat
// v0.7.50: Fix sanitize() stripping non-ASCII Unicode (em-dashes, smart quotes, accented chars) - removed \p{Print} filter that only matched ASCII; added NFC normalization fallback in replace/multi_replace; normalized oldText line endings in doReplace
// v0.7.49: ContextServerClient postToContextServer+postWithTimeout endpoint / -> /mcp (fixes 404 on file-structure registry calls)

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    springAiVersion = '1.1.2'
    groovyVersion = '5.0.4'
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'  // /actuator/health for startup probe
    
    // Jackson (for JSON serialization)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Spring AI MCP
    implementation "org.springframework.ai:spring-ai-mcp:${springAiVersion}"
    
    // Jakarta Annotations
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    
    // Groovy
    implementation "org.apache.groovy:groovy:${groovyVersion}"
    implementation "org.apache.groovy:groovy-json:${groovyVersion}"
    implementation "org.apache.groovy:groovy-nio:${groovyVersion}"
    implementation "org.apache.groovy:groovy-templates:${groovyVersion}"
    
    // Logging
    implementation 'ch.qos.logback:logback-classic'
    
    // SQLite - shared persistence with context server
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    // Toon token-optimised notation encoding
    implementation 'com.woodmawa.mcp.toon:mcp-toon-service:1.0-SNAPSHOT'

    // Apache POI - Office document read/write (.xlsx, .docx, .pptx)
    // Used by OfficeDocumentHandler for read_office / write_office tool actions
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // GroovyConcurrentUtils - XlsxAdapter/DocxAdapter/PptxAdapter DSL bridge
    implementation files('../GroovyConcurrentUtils/build/libs/GroovyConcurrentUtils-1.0-SNAPSHOT.jar')

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.apache.groovy:groovy-test:${groovyVersion}"
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
