spring:
  application:
    name: mcp-groovy-filesystem-server
  main:
    web-application-type: ${MCP_WEB_TYPE:servlet}
  jackson:
    default-property-inclusion: non_null

mcp:
  mode: ${MCP_MODE:http}

  filesystem:
    # Allowed directories for file operations
    allowed-directories: C:/Users/willw/IdeaProjects,C:/Users/willw/claude,C:/Users/willw/claude-sync
    max-file-size-mb: 10
    enable-write: true
    allow-symlinks: false

    # Active project and workspace roots
    active-project-root: C:/Users/willw/IdeaProjects/mcp-groovy-filesystem-server
    claude-workspace-root: C:/Users/willw/claude

    # Result bounds - keep responses token-efficient
    max-list-results: 100
    max-search-results: 50
    max-search-matches-per-file: 10
    max-tree-depth: 5
    max-tree-files: 200
    max-read-multiple: 10
    max-line-length: 1000
    max-response-size-kb: 100

    # v0.0.7: Chunked read threshold (KB) - files larger than this are auto-chunked
    read-chunk-threshold-kb: 300

    # v0.0.7: Default file pattern for project/content searches
    default-file-pattern: '.*\.(groovy|java|gradle|yml|yaml|properties|xml|json|md|txt|kt|kts)$'

  # Usage tracking persistence - shared SQLite DB with context server
  usage:
    db-path: C:/Users/willw/claude-sync/best_practices.db
    flush-on-shutdown: true

  # Script execution settings
  script:
    max-memory-mb: 256
    max-threads: 10
    max-execution-time-seconds: 60
    max-script-length: 100000
    max-working-dir-length: 4096

    # v0.0.7: Per-executor enable flags
    enable-bash: true
    enable-powershell: true
    enable-groovy: true
    enable-cmd: true

    # Command whitelists - blocked list takes precedence over allowed
    whitelist:
      powershell-allowed:
        - '.*'
      powershell-blocked:
        - '.*Remove-Item.*'
        - '.*Clear-.*Content.*'
        - '.*Stop-Computer.*'
        - '.*Restart-Computer.*'
        - '.*Format-Volume.*'
        - '.*Invoke-Expression.*'
        - '.*Set-ExecutionPolicy.*'
      bash-allowed:
        - '.*'
      bash-blocked:
        - '.*rm .*'
        - '.*chmod.*'
        - '.*chown.*'
        - '.*sudo.*'
        - '.*shutdown.*'
        - '.*reboot.*'
        - '.*kill.*'

logging:
  level:
    root: INFO
    com.softwood.mcp: DEBUG

---
spring:
  config:
    activate:
      on-profile: stdio
  main:
    banner-mode: off
server:
  port: 0

mcp:
  mode: stdio

# CRITICAL: In stdio mode ALL stdout/stderr must be silent - logback writes to FILE only.
# Any console output is read by Claude Desktop as JSON-RPC and causes parse errors.
logging:
  level:
    root: OFF
    com.softwood.mcp: OFF
    org.springframework: OFF
  file:
    name: logs/mcp-filesystem-stdio.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
