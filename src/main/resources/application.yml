spring:
  application:
    name: mcp-groovy-filesystem-server
  main:
    web-application-type: ${MCP_WEB_TYPE:servlet}
  # FIX-8: virtual threads for Tomcat - long-running tool calls no longer monopolise platform threads
  threads:
    virtual:
      enabled: true

server:
  port: ${MCP_HTTP_PORT:8081}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
mcp:
  mode: ${MCP_MODE:http}

  filesystem:
    # Allowed directories for file operations
    allowed-directories: C:/Users/willw/IdeaProjects,C:/Users/willw/claude,C:/Users/willw/claude-sync,C:/Users/willw/agentic-workspace
    max-file-size-mb: 10
    enable-write: true
    allow-symlinks: false

    # Active project and workspace roots
    active-project-root: C:/Users/willw/IdeaProjects/mcp-groovy-filesystem-server
    claude-workspace-root: C:/Users/willw/claude

    # Result bounds - keep responses token-efficient
    max-list-results: 100
    max-search-results: 50
    max-search-matches-per-file: 10
    max-tree-depth: 5
    max-tree-files: 200
    max-read-multiple: 10
    max-line-length: 1000
    max-response-size-kb: 100

    # v0.0.7: Chunked read threshold (KB) - files larger than this are auto-chunked
    # Lowered from 300 to 60: files >60KB auto-chunk rather than load in full.
    # 60KB = ~15K tokens which is still too large for a single call, but chunking
    # lets the model fetch only the chunk(s) it needs. v0.7.42.
    read-chunk-threshold-kb: 60

    # v0.7.25: Soft warning threshold for large read responses
    large-response-warn-chars: 8000

    # v0.7.32: Soft cap for action=read (chars). Truncates with note.
    # v0.7.42: Lowered from 40000 (~10K tokens) to 8000 (~2K tokens).
    # Goal: no single read call should burn more than 2K tokens.
    # For large files use head/range/grep/structure+get_method or chunked read.
    read-soft-cap-chars: 8000

    # v0.7.33: Hard cap for head/tail/range/grep content (chars).
    # v0.7.42: Lowered from 40000 (~10K tokens) to 12000 (~3K tokens).
    # grep/head/tail should be targeted — 3K tokens is still generous.
    partial-read-cap-chars: 12000

    # v0.7.33: Hard cap for multi aggregate output (chars across all files).
    # v0.7.42: Lowered from 80000 (~20K tokens) to 24000 (~6K tokens).
    # multi is for small targeted files — anything bigger should use individual reads.
    multi-read-cap-chars: 24000

    # v0.7.44: Inactivity gap (minutes) after which the session read-token accumulator resets.
    # Filesystem server has no session concept; this approximates session boundaries.
    session-gap-minutes: 30

    # v0.7.43: FIX-A - doRead refuses full reads on files with more than this many lines.
    # Forces use of structure/get_method/range. Pass options.force=true to override.
    read-max-lines-before-refuse: 200

    # v0.7.43: FIX-C - global backstop in McpController. No single tool response may
    # exceed this many chars regardless of which handler produced it.
    # 64000 chars = ~16K tokens. Set to 0 to disable.
    global-response-cap-chars: 64000

    # v0.0.7: Default file pattern for project/content searches
    default-file-pattern: '.*\.(groovy|java|gradle|yml|yaml|properties|xml|json|md|txt|kt|kts)$'

  # Context server integration - structure persistence (WI5)
  context-server:
    url: http://localhost:8082
    structure-group-id: mcp-servers
    structure-persist-enabled: true

  # Usage tracking persistence - shared SQLite DB with context server
  usage:
    db-path: C:/Users/willw/claude-sync/best_practices.db
    flush-on-shutdown: true

  # Script execution settings
  script:
    max-memory-mb: 256
    max-threads: 10
    max-execution-time-seconds: 60
    max-script-length: 100000
    max-working-dir-length: 4096

    # v0.0.7: Per-executor enable flags
    enable-bash: true
    enable-powershell: true
    enable-groovy: true
    enable-cmd: true

    # Command whitelists - blocked list takes precedence over allowed
    whitelist:
      powershell-allowed:
        - '.*'
      powershell-blocked:
        - '.*Remove-Item.*'
        - '.*Clear-.*Content.*'
        - '.*Stop-Computer.*'
        - '.*Restart-Computer.*'
        - '.*Format-Volume.*'
        - '.*Invoke-Expression.*'
        - '.*Set-ExecutionPolicy.*'
      bash-allowed:
        - '.*'
      bash-blocked:
        - '.*rm .*'
        - '.*chmod.*'
        - '.*chown.*'
        - '.*sudo.*'
        - '.*shutdown.*'
        - '.*reboot.*'
        - '.*kill.*'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.softwood.mcp: DEBUG

---
spring:
  config:
    activate:
      on-profile: stdio
  main:
    banner-mode: off
server:
  port: 0

mcp:
  mode: stdio

# Logging handled by logback-spring.xml (STDERR only, captured by Claude Desktop).
# stderr is a separate pipe from stdout - it does NOT corrupt MCP JSON-RPC messages.
